    desc: "Um time de robôs de IA num app de conversa, com um computador próprio pra trabalhar."
    destaque: "computador próprio"
    numero: "1.589"
    fala: "E agora o pódio. Em terceiro, o OpenMausBot, que não sai do Top dez. Você conversa com um time de robôs de IA como se fossem contatos, e cada um tem um computador só dele. Mil quinhentas e oitenta e nove estrelas."
  - etapa: repo
    repo: "meta/astryx"
    desc: "Da Meta: o kit de telas usado em treze mil apps internos, agora aberto e pronto pra IA."
    destaque: "treze mil apps"
    numero: "3.324"
    fala: "Em segundo, a Meta abriu o cofre. O Astryx é o kit de telas que move mais de treze mil aplicativos dentro da empresa, agora de graça e pronto pra IA usar. Três mil trezentas e vinte e quatro estrelas."
  - etapa: repo
    repo: "sherlock-project/sherlock"
    desc: "Procura um nome de usuário em mais de quatrocentas redes sociais e lista onde ele existe."
    destaque: "quatrocentas redes sociais"
    numero: "4.294"
    fala: "E o número um é o Sherlock. Você digita um apelido e ele acha a pessoa em mais de quatrocentas redes. Ontem era terceiro. Hoje disparou. É polêmico, use só pra se proteger. Quatro mil duzentas e noventa e quatro estrelas."
  - etapa: comentario
    fala: "Você teria coragem de procurar o seu próprio apelido? Conta aqui nos comentários. Tá tudo no inema ponto club, e amanhã tem mais."
