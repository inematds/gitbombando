    desc: "Dá à IA um navegador próprio pra abrir sites, clicar e preencher por você."
    destaque: "por você"
    numero: "914"
    fala: "Número cinco, o Agent Browser. É um programa de terminal que entrega um navegador para a IA abrir sites, clicar e preencher formulários no seu lugar. Novecentas e catorze estrelas."
  - etapa: repo
    repo: "anthropics/skills"
    desc: "Da Anthropic: as receitas oficiais que ensinam tarefas novas à IA."
    destaque: "receitas oficiais"
    numero: "1.052"
