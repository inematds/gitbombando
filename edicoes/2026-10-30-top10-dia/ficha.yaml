  - etapa: repo
    repo: "pingdotgg/t3code"
    desc: "Comande as IAs que rodam no seu computador direto do celular, de onde estiver."
    destaque: "do celular"
    numero: "920"
    fala: "Sétimo lugar, Tê Três Code. Com ele você comanda as IAs do seu computador pelo celular, de qualquer lugar, como se estivesse na frente da tela. Novecentas e vinte estrelas."
  - etapa: repo
    repo: "thedotmack/claude-mem"
    desc: "Memória para a IA lembrar o que você fez nas conversas anteriores, sem repetir tudo."
    destaque: "lembrar"
    numero: "1.145"
    fala: "Em sexto, Claude Mem, que já passa de cem mil estrelas. Ele dá memória pra sua IA: ela lembra o que vocês fizeram ontem. Hoje levou mil cento e quarenta e cinco estrelas."
  - etapa: repo
    repo: "Renhuai123/ziwei-doushu"
    desc: "Programa aberto de astrologia chinesa que monta o seu mapa do destino."
    destaque: "astrologia chinesa"
    numero: "1.146"
    fala: "Quinto lugar, o mais inesperado do dia. Ziwei Doushu é um programa aberto de astrologia chinesa que monta o seu mapa do destino. Mil cento e quarenta e seis estrelas."
  - etapa: repo
    repo: "obra/superpowers"
    desc: "Kit que ensina a IA a trabalhar com método: planejar, testar e revisar antes de entregar."
    destaque: "com método"
    numero: "1.255"
    fala: "Em quarto, superpowers, com mais de trezentas mil estrelas. Ele obriga a IA a planejar, testar e revisar antes de entregar, e não sai do Top dez. Mil duzentas e cinquenta e cinco estrelas hoje."
  - etapa: repo
    repo: "togg53192-cmd/jailbreaks"
    desc: "Coleção de textos feitos para burlar as travas de segurança de várias IAs. Polêmico."
    destaque: "burlar as travas"
    numero: "2.053"
    fala: "E agora o pódio. O bronze é polêmico: Jailbreaks, textos pra burlar as travas de segurança das IAs. Cresceu quase um quarto num dia, duas mil e cinquenta e três estrelas. Cuidado, isso pode te dar dor de cabeça."
  - etapa: repo
    repo: "HKUDS/DeepTutor"
    desc: "Professor particular de IA que monta aulas sob medida e acompanha você a vida toda."
    destaque: "sob medida"
    numero: "2.282"
    fala: "Prata pro DeepTutor, um professor particular de IA, gratuito, que monta aulas sob medida pra você. Duas mil duzentas e oitenta e duas estrelas. Ficou a um fio do topo."
  - etapa: repo
    repo: "pbakaus/impeccable"
    desc: "Ensina a IA a caprichar no visual e a pegar aquele design com cara de robô."
    destaque: "cara de robô"
    numero: "2.299"
    fala: "E o primeiro lugar, de novo, é o Impeccable. Ele ensina a sua IA a caprichar no visual e caça o design com cara de robô. Duas mil duzentas e noventa e nove estrelas. Por um triz."
  - etapa: comentario
    fala: "E aí, qual desses você vai testar primeiro? Comenta aqui embaixo. Tá tudo no inema ponto club, e amanhã tem mais."
