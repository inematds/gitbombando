partes:
- etapa: gancho
  fala: A Meta abriu de graça o kit que monta mais de treze mil aplicativos dela.
    Em sete dias, oito mil e setecentas estrelas.
- etapa: panorama
  fala: No Top cinco da semana, os projetos que mais cresceram somaram trinta e um
    mil cento e noventa e três estrelas. Vou do quinto ao primeiro.
  numero: '31.193'
- etapa: repo
  repo: we-promise/sure
  desc: App aberto de finanças pessoais, salvo pela comunidade depois de ser abandonado.
  destaque: salvo pela comunidade
  numero: '4.786'
  fala: Em quinto, Sure. Um aplicativo aberto pra cuidar das suas finanças pessoais.
    Custou quase um milhão de dólares, foi abandonado, e a comunidade salvou. Quatro
    mil setecentas e oitenta e seis estrelas.
- etapa: repo
  repo: anthropics/skills
  desc: Habilidades prontas da Anthropic para a IA criar planilhas, documentos e apresentações.
  destaque: Habilidades prontas
  numero: '4.847'
  fala: Número quatro vem da Anthropic, a dona do Claude. Skills é uma coleção de
    habilidades prontas pra IA criar planilhas, documentos e apresentações. Ganhou
    quatro mil oitocentas e quarenta e sete estrelas e já beira duzentas mil estrelas.
- etapa: repo
  repo: dream-num/univer
  desc: Um escritório completo, com planilhas e documentos, para pessoas e IAs usarem
    juntas.
  destaque: escritório completo
  numero: '5.845'
  fala: E agora o pódio. Bronze pro Univer. É um escritório inteiro, com planilha
    e documentos, que qualquer empresa coloca dentro do próprio sistema, pra gente
    e pra IA usarem juntas. Cinco mil oitocentas e quarenta e cinco estrelas.
- etapa: repo
  repo: GoogleChrome/modern-web-guidance-src
  desc: Guia do Google Chrome que ensina a IA a criar sites do jeito moderno, sem
    vícios antigos.
  destaque: sem vícios antigos
  numero: '7.015'
  fala: 'Prata pro Google. Junto com Microsoft e Mozilla, o time do Chrome criou um
    guia que ensina a IA a fazer sites do jeito moderno, sem vícios antigos. Quase
    quintuplicou: sete mil e quinze estrelas.'
- etapa: repo
  repo: meta/astryx
  desc: Kit de design da Meta, usado em mais de 13 mil apps, agora aberto e pronto
    para IA.
  destaque: agora aberto
  numero: '8.700'
  fala: E o primeiro lugar é da Meta. Astryx, o kit de design que roda em mais de
    treze mil aplicativos da empresa, agora aberto e gratuito, pronto pra você e pra
    IA. Oito mil e setecentas estrelas. Numa semana.
- etapa: comentario
  fala: Qual desses você vai testar primeiro? Me conta aqui embaixo. Tá tudo no inema
    ponto club, mas lá você aprende a integrar esses projetos em vez de só copiar,
    e direto na internet.
