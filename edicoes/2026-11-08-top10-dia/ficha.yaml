cta: {a: "QUAL VOCÊ VAI TESTAR? 👇", b: "comenta o número aqui embaixo", comentario: "vou testar o #1 🚀"}
club: "aprenda a usar essas IAs de verdade"
publicar:
  titulo: "Cloudflare segue no topo e um caça-apelidos invade o pódio: +2.085 estrelas no GitHub"
  contexto: "Top 10 do GitHub de 08/11/2026, do décimo ao primeiro, com os projetos que mais ganharam estrelas no dia. O Sherlock, que acha contas em mais de 400 redes só pelo nome de usuário, sobe ao pódio, e o Security Audit, da Cloudflare, fica em primeiro pelo segundo dia com 2.085 estrelas."
  telegram: "A Cloudflare segurou o topo do GitHub pelo segundo dia: o Security Audit, que faz a IA caçar falhas de segurança, ganhou +2.085 estrelas. No pódio também o OpenMausBot, time de robôs de IA de graça, e o Sherlock, que acha suas contas em mais de 400 redes só pelo apelido. Google e Anthropic disputam as receitas de IA no meio da lista."
