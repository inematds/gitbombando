- etapa: repo
  repo: mdiri-ai/SoduWork
  desc: Equipe de IAs em que uma faz o trabalho e outra confere antes de você aprovar.
  destaque: outra confere
  numero: '236'
  fala: Prata pro SoduWork. Aqui uma inteligência artificial faz o trabalho e outra
    confere. Se não ficar bom, volta. E só acaba quando uma pessoa aprova. Duzentas
    e trinta e seis estrelas por dia.
- etapa: repo
  repo: CzzzzzzJ/mdldm-maitian
  desc: Painel que publica um vídeo em sete redes e mostra qual delas dá dinheiro.
  destaque: qual delas dá dinheiro
  numero: '266'
  fala: E o primeiro lugar? Maitian. Um painel que espalha seu vídeo pelo YouTube,
