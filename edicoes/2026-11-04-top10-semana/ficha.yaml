publicar:
  titulo: "IA desenha feio? O GitHub gastou 26 mil estrelas pra consertar (#1 com 12.542)"
  contexto: "Top 10 da semana no GitHub, do décimo ao primeiro, com o que cada projeto faz em português simples. Destaque: três kits para a IA parar de fazer site com cara de robô e o T3 Code no topo com 12.542 estrelas em sete dias."
  telegram: "O Top 10 da semana no GitHub somou 67.733 estrelas. Três dos dez são kits pra IA parar de fazer site com cara de robô: Impeccable, Hallmark e Taste Skill. No topo, o T3 Code, que controla todas as IAs que programam no seu computador até pelo celular."
