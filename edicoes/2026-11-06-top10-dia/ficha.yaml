  manchete: "NVIDIA DERRUBA O REI: +2.679"
  destaque: "+2.679"
  objeto: "uma coroa dourada gigante rachando e caindo de um pedestal, com raios de luz verde e amarela escapando pelas rachaduras"
  fontes:
    - {nome: "github.com/trending", trecho: "NVIDIA/auto-ontology · 2,679 stars today"}
