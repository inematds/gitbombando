  - etapa: panorama
    fala: "Os dez projetos que mais cresceram hoje somaram treze mil quinhentas e noventa e oito estrelas. Vou do décimo ao primeiro."
    numero: "13.598"
  - etapa: repo
    repo: "JetBrains/thinkrail"
    desc: "Programa da JetBrains para criar software conversando com a IA, que aprende seu jeito."
    destaque: "aprende seu jeito"
    numero: "717"
    fala: "Em décimo, uma big tech. O ThinkRail, da JetBrains, é um programa pra criar software conversando com a IA, e não sai do Top dez. Hoje foram setecentas e dezessete estrelas."
  - etapa: repo
    repo: "mattpocock/skills"
    desc: "As receitas que um programador famoso usa todo dia para a IA trabalhar direito."
