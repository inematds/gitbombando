modo: semana
gancho:
  tipo: estatistica
  manchete: "O CONTROLE DAS IAS: +17.100"
  destaque: "+17.100"
  objeto: "um controle remoto dourado gigante rachando no meio, com raios de luz amarela e faíscas escapando pelas rachaduras"
  fontes:
    - {nome: "github.com/trending?since=weekly", trecho: "pingdotgg/t3code · 17,100 stars this week"}
abertura:
  cena: "sala escura cheia de telas de computador desligadas à noite, só a luz amarela vindo do centro"
partes:
  - etapa: gancho
    fala: "Dezessete mil e cem estrelas em sete dias. E o campeão do GitHub nem é uma IA nova. É um controle remoto pra mandar em todas elas."
  - etapa: panorama
    fala: "Os dez projetos que mais cresceram na semana somaram setenta e nove mil trezentas e setenta e três estrelas. Vou do décimo ao primeiro."
    numero: "79.373"
  - etapa: repo
    repo: "obra/superpowers"
    desc: "Kit que dá método à IA que programa: ela planeja, testa e revisa antes de entregar."
    destaque: "método"
    numero: "4.466"
    fala: "Em décimo, superpowers. Um kit que obriga a IA a ter método: planejar, testar e revisar antes de te entregar. Já passa de trezentas mil estrelas e ganhou mais quatro mil quatrocentas e sessenta e seis estrelas."
  - etapa: repo
    repo: "Renhuai123/ziwei-doushu"
    desc: "Programa aberto que monta o mapa da astrologia chinesa e entrega a leitura pronta."
    destaque: "astrologia chinesa"
    numero: "4.906"
    fala: "Número nove, o mais estranho da lista. Ziwei Doushu é a astrologia chinesa virando programa aberto: ele monta o seu mapa e entrega a leitura. Horóscopo no Top dez, com quatro mil novecentas e seis estrelas."
  - etapa: repo
    repo: "Donchitos/Claude-Code-Game-Studios"
    desc: "Transforma a IA num estúdio de games inteiro, com dezenas de agentes trabalhando juntos."
    destaque: "estúdio de games"
    numero: "5.719"
    fala: "Em oitavo, Claude Code Game Studios. Ele transforma a IA num estúdio de games inteiro: quarenta e nove agentes, cada um com seu cargo, como numa empresa de verdade. Ganhou cinco mil setecentas e dezenove estrelas."
  - etapa: repo
    repo: "Nutlope/hallmark"
    desc: "Kit de design para a IA que se recusa a deixar seu site com cara de feito por robô."
    destaque: "cara de feito por robô"
    numero: "6.624"
    fala: "Sétimo lugar, Hallmark. Um kit de design que se recusa a deixar o seu site com cara de feito por robô. Cinquenta estilos prontos e seis mil seiscentas e vinte e quatro estrelas."
  - etapa: repo
    repo: "milind-soni/OpenMausBot"
    desc: "Seu time de robôs de IA num aplicativo de conversa, cada um com seu próprio computador."
    destaque: "time de robôs"
    numero: "7.077"
    fala: "Em sexto, OpenMausBot. Você monta um time de robôs de IA e conversa com eles como se fossem contatos, cada um com seu próprio computador. Cresceu sessenta e sete por cento na semana: sete mil e setenta e sete estrelas."
  - etapa: repo
    repo: "thedotmack/claude-mem"
    desc: "Dá memória à IA: ela lembra o que fez nas conversas anteriores e não começa do zero."
    destaque: "memória"
    numero: "7.482"
    fala: "Número cinco, claude-mem. Cansou de a IA esquecer tudo e você ter de explicar de novo? Ele guarda o que ela fez e devolve na próxima conversa. São sete mil quatrocentas e oitenta e duas estrelas."
  - etapa: repo
    repo: "pbakaus/impeccable"
    desc: "Ensina a IA a caprichar no visual e dedura o design com cara de robô antes de ir pro ar."
    destaque: "caprichar no visual"
    numero: "7.623"
    fala: "Em quarto, Impeccable. Ele ensina a IA a caprichar no visual e dedura aquele design genérico antes de ir pro ar. Passou de cem mil estrelas e ganhou sete mil seiscentas e vinte e três estrelas."
  - etapa: repo
    repo: "D4Vinci/Scrapling"
    desc: "Kit que copia dados de qualquer site, até os que tentam bloquear robôs."
    destaque: "qualquer site"
    numero: "8.712"
    fala: "E agora o pódio. Em terceiro, Scrapling. Ele copia dados de qualquer site, até dos que tentam barrar robôs. Isso é polêmico, então cuidado com o que você coleta. Foram oito mil setecentas e doze estrelas."
  - etapa: repo
    repo: "mattpocock/skills"
    desc: "As habilidades que um programador experiente usa todo dia para a IA trabalhar direito."
    destaque: "todo dia"
    numero: "9.664"
    fala: "Em segundo, skills, do Matt Pocock. São as receitas que ele usa todo dia pra IA programar de verdade, sem improviso. Já tem mais de trezentas mil estrelas e ganhou nove mil seiscentas e sessenta e quatro estrelas."
  - etapa: repo
    repo: "pingdotgg/t3code"
    desc: "Controla todas as IAs que programam no seu computador pelo celular, num painel só."
    destaque: "pelo celular"
    numero: "17.100"
    fala: "E o número um. Tê Três Code. Um painel só pra mandar em todas as IAs que programam no seu computador, até pelo celular, com as assinaturas que você já tem. Foram dezessete mil e cem estrelas. Em sete dias."
  - etapa: comentario
    fala: "Qual desses você vai testar primeiro? Comenta aqui embaixo. Tá tudo no inema ponto club, e semana que vem tem mais."
