publicar:
  titulo: 'O Google perdeu o topo do GitHub: Univer dispara com +1.878 estrelas em
    um dia'
  contexto: Top 10 do GitHub de 16/11/2026, do décimo ao primeiro, com os projetos
    que mais ganharam estrelas no dia. O Univer, kit de escritório com IA, saltou
    do oitavo lugar para o primeiro com 1.878 estrelas e tirou o Google do topo depois
    de três dias.
  telegram: 'Virada no GitHub: o Univer, kit aberto pra montar seu próprio escritório
    com IA, ganhou 1.878 estrelas e tirou o Google do primeiro lugar. No pódio ainda
    estão o Modern Web Guidance, do Google, e o LoopForge, da Tencent, que cresceu
    90% num dia.'
