- etapa: repo
  repo: erkamyaman/safe-anything
  desc: Com um comando, acha brechas e senhas vazadas no seu código antes dos outros.
  destaque: senhas vazadas
  numero: '197'
  fala: Prata pro safe anything. Com um comando só, ele vasculha o seu código atrás
    de brechas e senhas vazadas, antes que alguém faça isso por você. Nasceu há quatro
    dias. Cento e noventa e sete estrelas por dia.
- etapa: repo
  repo: BaaRai/ARTEX
