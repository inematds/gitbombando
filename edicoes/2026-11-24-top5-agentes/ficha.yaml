  b: comenta o número aqui embaixo
  comentario: 'vou testar o #1 🚀'
club: aprenda a usar essas IAs de verdade
publicar:
  titulo: 'Novatos deixam Microsoft pra trás: time de robôs de IA ganha 185 estrelas
    por dia'
  contexto: O Top 5 dos sistemas de agentes de IA que mais crescem no GitHub em 24/11/2026,
    em estrelas por dia desde a criação, explicado sem jargão. O DS Bot, um time de
    robôs que conversam entre si, lidera com 185 estrelas por dia, à frente de Microsoft
    e Tencent.
  telegram: 'Top 5 dos agentes de IA que mais crescem no GitHub: o DS Bot lidera com
    185 estrelas por dia. Em segundo, o PiBot, com só três dias de vida. Microsoft
    e Tencent ficaram em quinto e quarto.'
