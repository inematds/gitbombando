modo: dia
gancho:
  tipo: noticia
  manchete: "META ABRIU O COFRE: +3.111"
  destaque: "+3.111"
  objeto: "um cofre dourado gigante com a porta arrancada, explodindo em peças de telas de aplicativo e faíscas amarelas"
  fontes:
    - {nome: "github.com/trending", trecho: "meta/astryx · 3,111 stars today"}
    - {nome: "github.com/meta/astryx", trecho: "the most-used and largest design system in the company — powering 13,000+ apps"}
abertura:
  cena: "cofre de banco escuro à noite, prateleiras cheias de telas de celular brilhando, só a luz amarela vindo do centro"
partes:
  - etapa: gancho
    fala: "A Meta liberou de graça o kit que monta treze mil aplicativos dela. E em um único dia, mais de três mil pessoas correram atrás."
  - etapa: panorama
    fala: "Os dez que mais cresceram hoje somaram onze mil setecentas e oitenta e seis estrelas. Tem Meta, Google e Anthropic duas vezes. Vou do décimo ao primeiro."
    numero: "11.786"
  - etapa: repo
    repo: "ranxianglei/billion-context"
    desc: "Espreme a conversa com a IA pra ela durar um mês inteiro, gastando cinco vezes menos."
    destaque: "cinco vezes menos"
    numero: "374"
    fala: "Abrindo em décimo, o Billion Context, um projeto chinês. Ele espreme a conversa com a IA pra ela durar um mês sem esquecer nada, e ainda gasta cinco vezes menos. Trezentas e setenta e quatro estrelas."
  - etapa: repo
    repo: "google-deepmind/mujoco"
    desc: "Do Google DeepMind: um simulador de física onde robôs treinam antes de serem construídos."
    destaque: "antes de serem construídos"
    numero: "453"
    fala: "Nono, o Google DeepMind. O MuJoCo é um mundo de mentira com física de verdade, onde robôs aprendem a andar e pegar coisas antes de existirem. Quatrocentas e cinquenta e três estrelas."
  - etapa: repo
    repo: "addyosmani/agent-skills"
    desc: "Os hábitos de um programador sênior empacotados pra IA seguir sempre, passo a passo."
    destaque: "programador sênior"
    numero: "465"
    fala: "Em oitavo, o Agent Skills, de um engenheiro do Google. Ele empacota os hábitos de um programador experiente pra IA seguir sempre: planejar, construir e conferir. Quatrocentas e sessenta e cinco estrelas."
  - etapa: repo
    repo: "anthropics/claude-quickstarts"
    desc: "Da Anthropic: projetos prontos pra você criar o seu próprio app com o Claude."
    destaque: "projetos prontos"
    numero: "530"
    fala: "Sétimo, a Anthropic, a empresa do Claude. O Claude Quickstarts entrega projetos prontos pra você sair do zero e montar o seu aplicativo com IA. Quinhentas e trinta estrelas."
  - etapa: repo
    repo: "vercel-labs/agent-browser"
    desc: "Dá à IA um navegador próprio pra abrir sites, clicar e preencher por você."
    destaque: "por você"
    numero: "775"
    fala: "Em sexto, o Agent Browser. É um programa de terminal que dá um navegador pra IA abrir sites, clicar e preencher formulário no seu lugar. Setecentas e setenta e cinco estrelas."
  - etapa: repo
    repo: "homeassistant-ai/ha-mcp"
    desc: "Você fala com a IA e ela configura e automatiza a sua casa inteligente."
    destaque: "casa inteligente"
    numero: "792"
    fala: "Número cinco, estreante. O HA MCP liga o Claude e o ChatGPT na sua casa inteligente. Você pede em português e a IA acende luz, cria rotina e ajusta tudo. Setecentas e noventa e duas estrelas."
  - etapa: repo
    repo: "mattpocock/skills"
    desc: "As receitas que um programador famoso usa todo dia pra IA trabalhar de verdade."
    destaque: "todo dia"
    numero: "1.223"
    fala: "Em quarto, o Skills do Matt Pocock, que não sai do Top dez. São as receitas que ele usa todo dia pra IA programar de verdade, sem perder o controle. Mil duzentas e vinte e três estrelas."
  - etapa: repo
    repo: "anthropics/skills"
    desc: "Da Anthropic: as receitas oficiais que ensinam tarefas novas ao Claude."
    destaque: "receitas oficiais"
    numero: "1.676"
    fala: "E agora o pódio. Em terceiro, a Anthropic de novo, e ela não sai do Top dez. O Skills traz as receitas oficiais que ensinam o Claude a fazer planilha, apresentação e muito mais. Mil seiscentas e setenta e seis estrelas."
  - etapa: repo
    repo: "sherlock-project/sherlock"
    desc: "Procura um nome de usuário em mais de quatrocentas redes sociais e lista onde ele existe."
    destaque: "quatrocentas redes sociais"
    numero: "2.387"
    fala: "Em segundo, o Sherlock, que ontem era o primeiro. Você digita um apelido e ele acha a pessoa em mais de quatrocentas redes. É polêmico, cuidado: use só pra se proteger. Duas mil trezentas e oitenta e sete estrelas."
  - etapa: repo
    repo: "meta/astryx"
    desc: "Da Meta: o kit de telas usado em treze mil apps internos, agora aberto e pronto pra IA."
    destaque: "treze mil apps"
    numero: "3.111"
    fala: "E o número um é da Meta. O Astryx é o kit de telas que move mais de treze mil aplicativos lá dentro. Agora é seu, de graça, e a IA já sabe usar. Três mil cento e onze estrelas."
  - etapa: comentario
    fala: "Se a Meta te desse o kit dela, qual aplicativo você criaria? Conta aqui nos comentários. Tá tudo no inema ponto club, e amanhã tem mais."
